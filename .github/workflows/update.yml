name: Обновление данных KASE
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 2"
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: Коммит data.json
        run: |
          git config user.name "kase-bot"
          git config user.email "kase-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Обновление данных KASE" && git push)
      - name: Опубликовать сайт
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Не удалось запустить публикацию сайта автоматически"
