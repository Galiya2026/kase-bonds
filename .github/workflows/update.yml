name: Обновление данных KASE
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 2"
  push:
    paths:
      - "index.html"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_data.py
      - name: Коммит data.json
        run: |
          git config user.name "kase-bot"
          git config user.email "kase-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Обновление данных KASE" && git push)
  deploy:
    needs: update
    if: ${{ !cancelled() && (needs.update.result == 'success' || needs.update.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
